<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0f">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <script>try{var t=JSON.parse(localStorage.getItem('gym_theme')||'null');if(t&&t!=='lime'){document.documentElement.dataset.theme=t;}}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito:wght@400;600;700;800&family=Noto+Serif+JP:wght@900&family=Russo+One&family=Exo+2:ital,wght@0,400;0,600;0,700;0,800;1,700&family=Rubik+Dirt&family=Oswald:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css?v=14">
  <title>Компания</title>
</head>
<body>
  <header class="top">
    <div><span class="eyebrow">Вместе веселее</span><h1>Компания</h1></div>
    <span id="net" class="net" hidden>офлайн</span>
  </header>
  <main>
    <div id="consent"></div>

    <div class="seg tabs" id="tabs">
      <button type="button" data-tab="feed" class="on">Лента</button>
      <button type="button" data-tab="board">Рейтинг</button>
      <button type="button" data-tab="awards">Достижения</button>
    </div>

    <section id="feed"><p class="muted">Загрузка…</p></section>

    <section id="board" hidden>
      <div class="card">
        <h3 id="board-title">Рейтинг месяца</h3>
        <div class="small muted">Сначала по числу посещений, при равенстве — по тоннажу</div>
        <div id="board-list"></div>
      </div>
    </section>

    <section id="awards" hidden>
      <div class="ach-grid" id="ach"></div>
      <h2>Мои рекорды</h2>
      <div class="card" id="records"></div>
    </section>

    <div class="card share-row">
      <div class="grow">
        <b>Показывать мои тренировки друзьям</b>
        <div class="small muted">Видны дата, тип тренировки, тоннаж и рекорды.
          Вес тела, замеры и заметки — никогда.</div>
      </div>
      <label class="switch" aria-label="Показывать мои тренировки друзьям">
        <input type="checkbox" id="share-toggle"><span></span>
      </label>
    </div>
  </main>

  <script src="/static/common.js?v=14"></script>
  <script src="/static/friends.js?v=14"></script>
</body>
</html>
