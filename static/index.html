<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0f">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/style.css?v=7">
  <title>Тренировка</title>
</head>
<body>
  <header class="top">
    <div><span class="eyebrow" id="today"></span><h1 id="page-title">Тренировка</h1></div>
    <span id="net" class="net" hidden>офлайн</span>
  </header>
  <main id="app"><p class="muted">Загрузка…</p></main>

  <div id="timer" class="timer" hidden>
    <svg class="timer-ring" width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">
      <circle cx="26" cy="26" r="21" fill="none" style="stroke:rgba(255,255,255,.1)" stroke-width="6"/>
      <circle id="timer-ring" cx="26" cy="26" r="21" fill="none" style="stroke:var(--violet)" stroke-width="6"
        stroke-linecap="round" stroke-dasharray="0 132" transform="rotate(-90 26 26)"/>
    </svg>
    <div>
      <div class="timer-label">Отдых</div>
      <div id="timer-left" class="timer-left">0:00</div>
    </div>
    <button id="t-plus" class="btn small" type="button">+30 с</button>
    <button id="t-skip" class="btn small primary" type="button">Готов</button>
  </div>

  <script src="/static/common.js?v=7"></script>
  <script src="/static/workout.js?v=7"></script>
</body>
</html>
