<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0f">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <script>try{var t=JSON.parse(localStorage.getItem('gym_theme')||'null');if(t&&t!=='lime'){document.documentElement.dataset.theme=t;}}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito:wght@400;600;700;800&family=Noto+Serif+JP:wght@900&family=Russo+One&family=Exo+2:ital,wght@0,400;0,600;0,700;0,800;1,700&family=Rubik+Dirt&family=Oswald:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css?v=14">
  <title>Тренировка</title>
</head>
<body>
  <header class="top">
    <div><span class="eyebrow" id="today"></span><h1 id="page-title">Тренировка</h1></div>
    <span id="net" class="net" hidden>офлайн</span>
    <a href="/settings" class="top-ava" id="top-ava" aria-label="Профиль" hidden></a>
  </header>
  <main id="app"><p class="muted">Загрузка…</p></main>

  <div id="timer" class="timer" hidden>
    <svg class="timer-ring" width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">
      <circle cx="26" cy="26" r="21" fill="none" style="stroke:var(--timer-track)" stroke-width="6"/>
      <circle id="timer-ring" cx="26" cy="26" r="21" fill="none" style="stroke:var(--violet)" stroke-width="6"
        stroke-linecap="round" stroke-dasharray="0 132" transform="rotate(-90 26 26)"/>
    </svg>
    <div>
      <div class="timer-label">Отдых</div>
      <div id="timer-left" class="timer-left">0:00</div>
    </div>
    <button id="t-plus" class="btn small" type="button">+30 с</button>
    <button id="t-skip" class="btn small primary" type="button">Готов</button>
  </div>

  <script src="/static/common.js?v=14"></script>
  <script src="/static/workout.js?v=14"></script>
</body>
</html>
