<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0f">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/style.css?v=6">
  <title>Тренировка</title>
</head>
<body>
  <header class="top">
    <div><span class="eyebrow" id="today"></span><h1>Тренировка</h1></div>
    <span id="net" class="net" hidden>офлайн</span>
  </header>
  <main id="app"><p class="muted">Загрузка…</p></main>

  <div id="timer" class="timer" hidden>

      <div class="timer-label">Отдых</div>

    </div>
    <i id="timer-bar" class="timer-bar"></i>
    <button id="t-plus" class="btn small" type="button">+30 с</button>
    <button id="t-skip" class="btn small primary" type="button">Готов</button>
  </div>

  <script src="/static/common.js?v=6"></script>
